[package]
name = "razerlite"
version = "0.1.0"
edition = "2024"
description = "Lightweight tray app to configure a Razer Huntsman V2 Analog and Viper V3 Pro without Synapse"
license = "MIT"
repository = "https://github.com/watdafawx/razerlite"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
hidapi = "2"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8"
tiny_http = "0.12"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Registry"] }
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Quick dev builds: cargo build --profile fast
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
strip = false
